name: Lighthouse

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @monopiston/contracts build
      - run: pnpm --filter @monopiston/frontend build
      # lhci via dlx para no agregarlo como dependencia ni tocar el lockfile.
      - run: pnpm dlx @lhci/cli@0.14.0 autorun

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14
