name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dracing_test
          POSTGRES_PASSWORD: dracing
          POSTGRES_USER: dracing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dracing -d dracing_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dracing:dracing@localhost:5432/dracing_test

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Falla el build ante dependencias con CVE de severidad alta o crítica.
      # Las moderadas/bajas no bloquean; revisar con `pnpm audit` localmente.
      - run: pnpm audit --audit-level=high
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/001_initial_schema.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/002_seed_reference_data.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
