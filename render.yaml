# Blueprint de Render para el backend (https://render.com/docs/blueprint-spec).
# El frontend vive en Vercel, PostgreSQL en Supabase y los medios en Cloudinary.
# Guía completa de despliegue: docs/deploy-render.md

services:
  - type: web
    name: dracing-backend
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: TZ
        value: America/Santiago
      - key: SESSION_SECRET
        generateValue: true
      # Session pooler de Supabase: IPv4, puerto 5432. No usar el pooler de
      # transacciones 6543 porque las migraciones toman un advisory lock.
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        value: https://d-racing-pro-frontend.vercel.app
      - key: API_ORIGIN
        value: https://d-racing-pro-frontend.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://d-racing-pro-frontend.vercel.app/v1/auth/google/callback
      # Bootstrap idempotente del único administrador local.
      - key: ADMIN_DISPLAY_NAME
        value: Administrador Monopiston
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Flow: sandbox por defecto; cambiar a https://www.flow.cl/api al pasar a producción.
      - key: FLOW_API_BASE
        value: https://sandbox.flow.cl/api
      - key: FLOW_API_KEY
        sync: false
      - key: FLOW_SECRET_KEY
        sync: false
      # Cloudinary queda listo para imágenes/archivos. El secret nunca llega
      # al frontend ni se incluye en variables VITE_*.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: dracing-pro
