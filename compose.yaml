name: dracing-pro

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dracing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dracing}
      POSTGRES_USER: ${POSTGRES_USER:-dracing}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dracing}:${POSTGRES_PASSWORD:-dracing}@postgres:5432/${POSTGRES_DB:-dracing}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./infra/docker/run-migrations.sh:/usr/local/bin/run-migrations:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/run-migrations']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrador Taller Mono Pistón}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      API_ORIGIN: http://localhost:${API_PORT:-3300}
      APP_ORIGIN: http://localhost:${APP_PORT:-5176}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-dracing-pro}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dracing}:${POSTGRES_PASSWORD:-dracing}@postgres:5432/${POSTGRES_DB:-dracing}
      FLOW_API_BASE: ${FLOW_API_BASE:-https://sandbox.flow.cl/api}
      FLOW_API_KEY: ${FLOW_API_KEY:-}
      FLOW_SECRET_KEY: ${FLOW_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3300/v1/auth/google/callback}
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-me-now}
      TZ: America/Santiago
    ports:
      - '127.0.0.1:${API_PORT:-3300}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ''
    ports:
      - '127.0.0.1:${APP_PORT:-5176}:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
